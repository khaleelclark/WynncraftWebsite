server {
  listen 80;
  server_name khaleelclark.com www.khaleelclark.com; # your domain
  return 301 https://$host$request_uri/;
}

server {
  listen 443 ssl http2;
  server_name khaleelclark.com www.khaleelclark.com; # your domain

  ssl_certificate     /etc/letsencrypt/live/khaleelclark.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/khaleelclark.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:5032/; # or your docker backend port on host
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}

server {
  listen 80;
  server_name auth.khaleelclark.com; # your authentik domain
  return 301 https://$host$request_uri/;
}

server {
  listen 443 ssl http2;
  server_name auth.khaleelclark.com; # your authentik domain

  ssl_certificate     /etc/letsencrypt/live/auth.khaleelclark.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/auth.khaleelclark.com/privkey.pem;

  location / {
    proxy_pass http://authentik-server:9000/; # or your authentik port on host
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}