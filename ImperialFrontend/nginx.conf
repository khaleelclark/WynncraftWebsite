# Redirect HTTP -> HTTPS for both hostnames
server {
  add_header X-Served-By "frontend-nginx" always;
  listen 80;
  server_name novus.dpdns.org auth.novus.dpdns.org;
  return 301 https://$host$request_uri;
}

# Main site (frontend + /api proxy)
server {
  add_header X-Served-By "frontend-nginx" always;
  listen 443 ssl http2;
  server_name novus.dpdns.org;

  ssl_certificate     /etc/letsencrypt/live/novus.dpdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/novus.dpdns.org/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

    # IMPORTANT: ensure /api goes to backend, not SPA
    location = /api {
      return 301 /api/;
    }

    location ^~ /api/ {
      proxy_pass http://backend:5032;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }


  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Authentik
server {
  listen 443 ssl http2;
  server_name auth.novus.dpdns.org;

  ssl_certificate     /etc/letsencrypt/live/novus.dpdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/novus.dpdns.org/privkey.pem;

  location / {
    proxy_pass http://authentik-server:9000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}



