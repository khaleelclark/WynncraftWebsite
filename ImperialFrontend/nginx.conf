# Main site (imperial.local)
server {
  listen 80;
  server_name imperial.local;

  root /usr/share/nginx/html;
  index index.html;

  # Frontend SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend API
  location /api/ {
    proxy_pass http://imperial_backend:5032;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Authentik subdomain (auth.imperial.local)
server {
  listen 80;
  server_name auth.imperial.local;

  # Use resolver to allow dynamic hostname resolution
  resolver 127.0.0.11 valid=30s;
  set $authentik_backend imperialwebsite-authentik-server-1:9000;

  location / {
    proxy_pass http://$authentik_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
