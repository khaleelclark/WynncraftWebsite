services:
  postgresql:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imperial-net

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imperial-net

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: 6qh+s3chrsrX5JoLfEAFUbTZGXLI8XnVUwouFuzXAVl8VhK6TVGpBBu4Kdp9mEz1H18=
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_REDIS__HOST: redis
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - ./authentik-data:/media
      - ./custom-templates:/templates
    networks:
      - imperial-net

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: 6qh+s3chrsrX5JoLfEAFUbTZGXLI8XnVUwouFuzXAVl8VhK6TVGpBBu4Kdp9mEz1H18=
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_REDIS__HOST: redis
    volumes:
      - ./authentik-data:/media
      - ./custom-templates:/templates
    user: root
    networks:
      - imperial-net

  backend:
    build:
      context: ./ImperialBackend
      dockerfile: Dockerfile.dev
    volumes:
      - ./ImperialBackend:/app
    ports:
      - "5032:5032"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ImperialDb_New;User Id=sa;Password=SomeStrongPassword123!;Encrypt=False;TrustServerCertificate=True"
    depends_on:
      - db
    networks:
      - imperial-net

  frontend:
    build:
      context: ./ImperialFrontend
      dockerfile: Dockerfile.dev
    container_name: imperial_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./ImperialFrontend:/app
    environment:
      NODE_ENV: development
    depends_on:
      - backend
    networks:
      - imperial-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SomeStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - imperial-net

volumes:
  sql_data:

networks:
  imperial-net:
    external: true
    name: imperial-net
