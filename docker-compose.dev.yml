services:
  postgresql:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wynncraft-guild-net

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wynncraft-guild-net

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - ./authentik-data:/media
      - ./custom-templates:/templates
    networks:
      - wynncraft-guild-net

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
      - ./authentik-data:/media
      - ./custom-templates:/templates
    user: root
    networks:
      - wynncraft-guild-net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: backend
    volumes:
      - ./Backend:/app
    ports:
      - "5032:5032"
    env_file:
      - .env.dev
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__DefaultConnection_FILE: /run/secrets/sqlserver_connection_string
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      AUTHENTIK_URL: ${AUTHENTIK_URL}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-raid-rabbit}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-wynncraft}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-wynncraft-website}
      RABBITMQ_QUEUE_RAIDS_COMPLETED: ${RABBITMQ_QUEUE_RAIDS_COMPLETED:-raids.completed.q}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_website_password
    secrets:
      - sqlserver_connection_string
      - rabbitmq_website_password
    depends_on:
      - db
    networks:
      - wynncraft-guild-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    env_file:
      - .env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    depends_on:
      - backend
    networks:
      - wynncraft-guild-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wynncraft_db
    env_file:
      - .env.dev
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - wynncraft-guild-net

secrets:
  rabbitmq_website_password:
    file: ./secrets/rabbitmq_website_password.txt

  sqlserver_connection_string:
    file: ./secrets/sqlserver_connection_string.txt

volumes:
  sql_data:

networks:
  wynncraft-guild-net:
    external: true
    name: wynncraft-guild-net
